name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run check:secrets
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm test
      - name: Build web (dummy public values only)
        run: npm run build -w @onwa/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:4000

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: onwa_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: onwa_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply shim and migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/shim/local_auth_shim.sql
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Run SQL tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/001_rbac_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/002_sellers_addresses.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/003_catalog.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/004_orders.sql
