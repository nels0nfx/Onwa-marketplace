# Render blueprint for the API. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: onwa-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:shared && npm run build -w @onwa/api
    startCommand: npm run start -w @onwa/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
